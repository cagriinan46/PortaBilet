name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'bilet-frontend/**'
      - '.github/workflows/frontend-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'bilet-frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.14.0'

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bilet-frontend
    
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.JS
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: bilet-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        
      - name: Run Eslint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Create production build
        run: npm run build
      

