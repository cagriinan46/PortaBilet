name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'bilet-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.14.0'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bilet-frontend
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.JS
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: bilet-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        
      - name: Run Eslint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Create production build
        run: npm run build

  deploy:
  needs: frontend
  if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  runs-on: ubuntu-latest

  permissions:
    contents: read
    id-token: write

  defaults:
    run:
      working-directory: bilet-frontend

  steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Node.JS
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
        cache-dependency-path: bilet-frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build frontend
      run: npm run build
      env:
        VITE_API_URL: ""

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Upload frontend to S3
      run: aws s3 sync dist/ s3://${{ vars.FRONTEND_BUCKET_NAME }} --delete

    - name: Invalidate CloudFront cache
      run: |
        aws cloudfront create-invalidation \
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
          --paths "/*"
      

