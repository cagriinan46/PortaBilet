name: Backend CI

on:
  push:
    branches: 
      - main
    paths:
      - 'bilet-backend/**'
      - '.github/workflows/backend-ci.yml'

  pull_request:
    branches: 
      - main
    paths:
      - 'bilet-backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bilet-backend

    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: bilet-backend/requirements.txt
        
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v
