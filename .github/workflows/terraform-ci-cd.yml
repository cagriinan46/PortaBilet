name: Terraform CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - 'bilet-terraform/**'
      - '.github/workflows/terraform-ci-cd.yml'
  push:
    branches:
      - main
    paths:
      - 'bilet-terraform/**'
      - '.github/workflows/terraform-ci-cd.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation to run against the main branch
        required: true
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bilet-terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without remote state
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform validate -no-color

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: bilet-terraform
    env:
      TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
      TF_VAR_iyzico_api_key: ${{ secrets.TF_VAR_IYZICO_API_KEY }}
      TF_VAR_iyzico_secret_key: ${{ secrets.TF_VAR_IYZICO_SECRET_KEY }}
      TF_VAR_sender_mail: ${{ secrets.TF_VAR_SENDER_MAIL }}
      TF_VAR_sender_app_password: ${{ secrets.TF_VAR_SENDER_APP_PASSWORD }}
      TF_VAR_oauth2_secret_key: ${{ secrets.TF_VAR_OAUTH2_SECRET_KEY }}
      TF_VAR_openweather_api_key: ${{ secrets.TF_VAR_OPENWEATHER_API_KEY }}
      TF_VAR_gemini_api_key: ${{ secrets.TF_VAR_GEMINI_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6

      - name: Verify deployment configuration
        env:
          TERRAFORM_ROLE_ARN: ${{ vars.TERRAFORM_ROLE_ARN }}
        run: |
          test -n "$TERRAFORM_ROLE_ARN"
          test -n "$TF_VAR_db_password"
          test -n "$TF_VAR_iyzico_api_key"
          test -n "$TF_VAR_iyzico_secret_key"
          test -n "$TF_VAR_sender_mail"
          test -n "$TF_VAR_sender_app_password"
          test -n "$TF_VAR_oauth2_secret_key"
          test -n "$TF_VAR_openweather_api_key"
          test -n "$TF_VAR_gemini_api_key"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Initialize remote state
        run: terraform init -input=false -lockfile=readonly

      - name: Create plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply plan
        if: ${{ inputs.operation == 'apply' }}
        run: terraform apply -input=false -no-color tfplan
